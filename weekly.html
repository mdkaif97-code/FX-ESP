<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FX-ESP | Weekly Tournament</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#03060b;
    color:white;
    min-height:100vh;
}

header{
    text-align:center;
    padding:30px 15px;
    background:#05080f;
    border-bottom:1px solid #168cff;
}

header h1{
    font-size:34px;
    letter-spacing:4px;
    text-shadow:0 0 15px #168cff;
}

header p{
    margin-top:8px;
    color:#55c5ff;
}

.container{
    width:92%;
    max-width:900px;
    margin:40px auto;
}

.box{
    text-align:center;
    padding:45px 25px;
    background:linear-gradient(145deg,#0b1422,#050a12);
    border:1px solid #17415f;
    border-radius:18px;
    box-shadow:0 0 25px rgba(32,167,255,.12);
}

.icon{
    width:90px;
    height:90px;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-size:42px;
    background:#071a2d;
    border:2px solid #168cff;
}

h2{
    color:#40baff;
    font-size:30px;
    margin-bottom:15px;
}

.message{
    color:#9eb0c4;
    font-size:16px;
    line-height:1.7;
}

.back{
    display:inline-block;
    margin-top:30px;
    padding:12px 28px;
    border-radius:8px;
    background:#087fd1;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

footer{
    text-align:center;
    margin-top:80px;
    padding:30px;
    color:#66788b;
}
</style>
</head>

<body>

<header>
    <h1>FX-ESP</h1>
    <p>WEEKLY TOURNAMENT</p>
</header>

<div class="container">

    <div class="box">

        <div class="icon">🏆</div>

        <h2>WEEKLY TOURNAMENT</h2>

        <p class="message">
            Weekly tournament details will be announced soon.
            <br>
            Stay tuned for the next FX-ESP battle!
        </p>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>

</div>

<footer>
    © 2026 FX-ESP • Weekly Tournament
</footer>

</body>
</html>
