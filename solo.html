<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX-ESP | BR Solo</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
    background:#03060b;
    color:white;
}

header{
    text-align:center;
    padding:25px 15px;
    background:#05080f;
    border-bottom:1px solid #168cff;
}

header h1{
    font-size:32px;
    letter-spacing:4px;
    text-shadow:0 0 15px #168cff;
}

header p{
    color:#55c5ff;
    margin-top:7px;
}

.container{
    width:94%;
    max-width:1000px;
    margin:30px auto;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h2{
    color:#40baff;
    font-size:28px;
}

.title p{
    color:#8799ad;
    margin-top:8px;
}

.table-box{
    overflow-x:auto;
    background:#080f19;
    border:1px solid #17415f;
    border-radius:12px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th{
    background:#087fd1;
    padding:14px 10px;
    text-align:center;
}

td{
    padding:13px 10px;
    text-align:center;
    border-bottom:1px solid #172b40;
    color:#d7e2ed;
}

tr:hover{
    background:#0d1a2b;
}

.rank{
    color:#40baff;
    font-weight:bold;
}

.total{
    color:#fff;
    font-weight:bold;
}

.back{
    display:block;
    width:max-content;
    margin:25px auto;
    padding:11px 25px;
    border-radius:8px;
    background:#087fd1;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.info{
    margin-top:25px;
    text-align:center;
    color:#8fa2b7;
}

footer{
    text-align:center;
    padding:30px;
    color:#66788b;
}
</style>
</head>

<body>

<header>
    <h1>FX-ESP</h1>
    <p>BR SOLO TOURNAMENT</p>
</header>

<div class="container">

    <div class="title">
        <h2>SOLO MATCH</h2>
        <p>30 Players • 1 Match</p>
    </div>

    <div class="table-box">

        <table>

            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th>Kills</th>
                    <th>Kill Points</th>
                    <th>Placement Points</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td class="rank">1</td>
                    <td>Player 01</td>
                    <td>0</td>
                    <td>0</td>
                    <td>0</td>
                    <td class="total">0</td>
                </tr>

                <tr>
                    <td class="rank">2</td>
                    <td>Player 02</td>
                    <td>0</td>
                    <td>0</td>
                    <td>0</td>
                    <td class="total">0</td>
                </tr>

                <tr>
                    <td class="rank">3</td>
                    <td>Player 03</td>
                    <td>0</td>
                    <td>0</td>
                    <td>0</td>
                    <td class="total">0</td>
                </tr>

            </tbody>

        </table>

    </div>

    <div class="info">
        Total Slots: <b>30 Players</b> • Match: <b>1</b>
    </div>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</div>

<footer>
    © 2026 FX-ESP • BR Solo
</footer>

</body>
</html>
