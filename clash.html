<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX-ESP | Clash Squad</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#03060b;
    color:#fff;
}

header{
    text-align:center;
    padding:25px 15px;
    background:#05080f;
    border-bottom:1px solid #168cff;
}

header h1{
    font-size:32px;
    letter-spacing:4px;
    text-shadow:0 0 15px #168cff;
}

header p{
    margin-top:8px;
    color:#55c5ff;
}

.container{
    width:94%;
    max-width:1000px;
    margin:30px auto;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h2{
    color:#40baff;
    font-size:28px;
}

.title p{
    margin-top:8px;
    color:#8799ad;
}

.info-box{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:25px;
}

.info{
    padding:15px;
    text-align:center;
    background:#080f19;
    border:1px solid #17415f;
    border-radius:10px;
}

.info strong{
    display:block;
    color:#40baff;
    font-size:20px;
}

.info span{
    color:#8fa2b7;
    font-size:13px;
}

.table-box{
    overflow-x:auto;
    background:#080f19;
    border:1px solid #17415f;
    border-radius:12px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th{
    background:#087fd1;
    padding:14px 10px;
}

td{
    padding:13px 10px;
    text-align:center;
    border-bottom:1px solid #172b40;
    color:#d7e2ed;
}

tr:hover{
    background:#0d1a2b;
}

.rank{
    color:#40baff;
    font-weight:bold;
}

.total{
    font-weight:bold;
    color:#fff;
}

.back{
    display:block;
    width:max-content;
    margin:25px auto;
    padding:11px 25px;
    border-radius:8px;
    background:#087fd1;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:30px;
    color:#66788b;
}

@media(max-width:600px){
    .info-box{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>FX-ESP</h1>
    <p>CLASH SQUAD TOURNAMENT</p>
</header>

<div class="container">

    <div class="title">
        <h2>CLASH SQUAD</h2>
        <p>6 Teams • 4 Players Per Team • 1 Match</p>
    </div>

    <div class="info-box">

        <div class="info">
            <strong>6</strong>
            <span>Teams</span>
        </div>

        <div class="info">
            <strong>24</strong>
            <span>Players</span>
        </div>

        <div class="info">
            <strong>1</strong>
            <span>Match</span>
        </div>

    </div>

    <div class="table-box">

        <table>

            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Team</th>
                    <th>Players</th>
                    <th>Wins</th>
                    <th>Points</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td class="rank">1</td>
                    <td>Team 01</td>
                    <td>4</td>
                    <td>0</td>
                    <td class="total">0</td>
                </tr>

                <tr>
                    <td class="rank">2</td>
                    <td>Team 02</td>
                    <td>4</td>
                    <td>0</td>
                    <td class="total">0</td>
                </tr>

                <tr>
                    <td class="rank">3</td>
                    <td>Team 03</td>
                    <td>4</td>
                    <td>0</td>
                    <td class="total">0</td>
                </tr>

                <tr>
                    <td class="rank">4</td>
                    <td>Team 04</td>
                    <td>4</td>
                    <td>0</td>
                    <td class="total">0</td>
                </tr>

                <tr>
                    <td class="rank">5</td>
                    <td>Team 05</td>
                    <td>4</td>
                    <td>0</td>
                    <td class="total">0</td>
                </tr>

                <tr>
                    <td class="rank">6</td>
                    <td>Team 06</td>
                    <td>4</td>
                    <td>0</td>
                    <td class="total">0</td>
                </tr>

            </tbody>

        </table>

    </div>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</div>

<footer>
    © 2026 FX-ESP • Clash Squad
</footer>

</body>
</html>
